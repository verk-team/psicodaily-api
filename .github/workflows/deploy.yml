# Push numa branch release/*: gera a imagem, manda para o Docker Hub e atualiza a VPS por SSH.
# Não espera o ci.yml: só crie a release/* a partir de um commit com o CI verde.
name: Build and Deploy

on:
  push:
    branches: ['release/*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # latest é a que o compose usa; a do commit fica para voltar a uma versão anterior
          tags: |
            cavalliniph/psicodaily-api:latest
            cavalliniph/psicodaily-api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /opt/psicodaily-api
            # Compose e Caddyfile do mesmo commit que gerou a imagem (o .env não está no git e fica)
            git fetch origin
            git checkout --detach ${{ github.sha }}
            docker compose pull
            # Recria só o que mudou (o container antigo para antes de o novo abrir o .FDB);
            # --wait espera o healthcheck e falha o job se a api não ficar healthy
            docker compose up -d --wait
