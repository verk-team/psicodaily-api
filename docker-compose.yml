# Sobe a API do PsicoDaily na VPS, com o Firebird dentro do mesmo container, e o Caddy
# na frente com HTTPS (api.psicodaily.tech, ver Caddyfile). O banco fica no volume
# firebird-data, então recriar o container não apaga os dados.

services:
  api:
    # Imagem publicada no Docker Hub; a VPS só baixa, não builda
    image: cavalliniph/psicodaily-api:latest
    container_name: psicodaily-api
    env_file: .env
    environment:
      # Fica aqui e não no .env porque precisa estar dentro da pasta montada pelo volume
      DB_DATABASE: /var/lib/firebird/data/BANCO.FDB
      # O Firebird roda no mesmo container que a API
      DB_HOST: 127.0.0.1
    volumes:
      # Sem o volume, o banco ficaria no disco do container e sumiria a cada recriação (todo deploy)
      - firebird-data:/var/lib/firebird/data
    ports:
      # O Docker passa por cima do firewall: o 127.0.0.1 deixa só a própria VPS acessar.
      - "127.0.0.1:8000:8000"
      # Firebird para o DBeaver, só por túnel SSH (ver architecture.md); nunca sem o 127.0.0.1
      - "127.0.0.1:3050:3050"
    # Volta sozinho se cair ou se a VPS reiniciar, menos quando foi parado de propósito
    restart: "unless-stopped"
    healthcheck:
      # A imagem slim não tem curl; o urlopen termina com erro se /api/saude não responder 200
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/saude')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Carência para Firebird, backup (gbak) e migrations rodarem antes do gunicorn subir
      start_period: 60s
  caddy:
    image: caddy:2
    ports:
      # As únicas portas abertas para a internet: 80 (validação do Let's Encrypt e
      # redirecionamento) e 443 (HTTPS). A api só é alcançada pela rede do compose.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados emitidos: sem o volume, cada recriação pediria um novo e o
      # Let's Encrypt bloqueia o domínio depois de 5 pedidos iguais na semana.
      - caddy-data:/data
    restart: "unless-stopped"

volumes:
  # Vazio = padrão: o Docker cria e guarda o volume na própria VPS
  firebird-data:
  caddy-data:
